plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6,7)'
}

group = 'com.samuel.watcher'
archivesBaseName = 'watcher-mod'
version = '1.0.0'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    
    runs {
        client {
            workingDirectory project.file('run')
            ideaModule "${rootProject.name}.main"
            args '--username=Developer'
            mods {
                watcher {
                    source sourceSets.main
                }
            }
        }
        
        server {
            workingDirectory project.file('run')
            ideaModule "${rootProject.name}.main"
            args '--nogui'
            mods {
                watcher {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.19'
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'      : 'Watcher Mod',
                'Specification-Vendor'     : 'Samuel',
                'Specification-Version'    : '1',
                'Implementation-Title'     : project.name,
                'Implementation-Version'   : project.version,
                'Implementation-Vendor'    : 'Samuel',
                'Implementation-Timestamp' : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

java {
    withSourcesJar()
}
