{% extends "base.html" %}

{% block title %}{{ info_title }} - TorresFlix{% endblock %}
{% block navbar_class %}solid{% endblock %}

{% block body %}
<main style="max-width:900px; margin:0 auto; padding:140px 24px 90px;">
    <p style="color:#e50914; font-weight:700; letter-spacing:1px; text-transform:uppercase;">TorresFlix</p>
    <h1 style="font-size:42px; margin:16px 0 20px;">{{ info_title }}</h1>
    <p style="max-width:650px; color:#bbb; font-size:18px; line-height:1.7;">{{ info_text }}</p>
    <a class="btn btn-play" style="margin-top:32px;" href="{{ url_for('home') }}">Volver al inicio</a>
</main>
{% endblock %}
